name: macOS installer and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute deterministic release version
        id: version
        run: |
          scripts/release-metadata.sh | tee "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-sources.py
          python3 scripts/test-app-bundle.py
          python3 scripts/test-installation-actions.py
          python3 scripts/test-appcast.py
          python3 scripts/test-update-signature.py
          swift build --disable-keychain --product AppleRemoteAudioCapture
          swift test --disable-keychain
      - name: Build app, driver, and standalone uninstaller
        run: |
          scripts/build-app.sh
          scripts/build-driver.sh
          scripts/build-uninstaller.sh
          test "$(lipo -archs 'dist/Voice Input Buddy.app/Contents/MacOS/VoiceInputBuddy')" = "$BUILD_ARCH"
          test "$(lipo -archs dist/VoiceInputBuddyMic.driver/Contents/MacOS/VoiceInputBuddyMic)" = "$BUILD_ARCH"
      - name: Package app, driver, and matching complete source
        run: |
          scripts/build-release-package.sh
          scripts/verify-release-package.sh
          if [[ "$BUILD_ARCH" == arm64 ]]; then
            scripts/build-release-sources.sh
            python3 scripts/build-release-notes.py
          fi
      - name: Sign and verify production update package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: scripts/sign-release-update.sh
      - name: Checksum release assets
        run: |
          source scripts/architecture.sh
          cd dist/release
          shasum -a 256 * > "SHA256SUMS_$RELEASE_ARCH_LABEL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-release-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-release-*
          merge-multiple: true
          path: release
      - name: Publish release
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          macOS 14 or later, Apple Silicon and Intel.

          Download the `Voice_Input_Buddy_*_arm64.pkg` installer for Apple Silicon or
          `Voice_Input_Buddy_*_intel.pkg` for Intel. Matching standalone uninstaller
          PKGs are attached; uninstall defaults to deleting your settings, logs and caches. The app installer installs both
          `/Applications/Voice Input Buddy.app` and the virtual microphone driver.
          Administrator authorization is required. Installing the driver briefly
          restarts Core Audio and may interrupt playback or recording.

          This build uses ad-hoc application signatures. The PKG is unsigned and
          not notarized by Apple; it may be blocked by Gatekeeper and application
          updates may require renewed Input Monitoring / Accessibility permissions.
          Matching complete source (including patched BlackHole and Sparkle) and
          SHA-256 checksums are attached.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A completed release is immutable on rerun; do not replace its files.
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" release/* --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
